<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><style>
*{margin:0;box-sizing:border-box}body{background:var(--color-bg);display:flex;align-items:center;gap:22px;height:150px;padding:0 24px}
.ic{color:var(--color-text-secondary)}
.ic.purple{color:var(--atlas-purple)}.ic.cyan{color:var(--atlas-cyan)}.ic.green{color:var(--atlas-green)}.ic.yellow{color:var(--atlas-yellow)}
</style></head><body>
<i data-lucide="house" class="ic"></i>
<i data-lucide="message-circle" class="ic purple"></i>
<i data-lucide="book-open" class="ic cyan"></i>
<i data-lucide="building-2" class="ic"></i>
<i data-lucide="trending-up" class="ic yellow"></i>
<i data-lucide="settings" class="ic"></i>
<i data-lucide="search" class="ic"></i>
<i data-lucide="shield" class="ic green"></i>
<i data-lucide="moon" class="ic"></i>
<script>lucide.createIcons({attrs:{width:26,height:26,'stroke-width':1.75}})</script>
</body></html>
