<!-- @dsCard group="Colors" viewport="700x130" name="Semantic States" subtitle="Success / warning / error / info — never color-only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
*{margin:0;box-sizing:border-box}body{background:var(--color-bg);padding:20px;font-family:var(--font-body);display:flex;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--color-surface-elevated);border:1px solid var(--color-border);color:var(--color-text-primary);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%}
</style></head><body>
<div class="pill"><span class="dot" style="background:var(--color-success)"></span>Éxito</div>
<div class="pill"><span class="dot" style="background:var(--color-warning)"></span>Atención</div>
<div class="pill"><span class="dot" style="background:var(--color-error)"></span>Error</div>
<div class="pill"><span class="dot" style="background:var(--color-cyan)"></span>Información</div>
<div class="pill"><span class="dot" style="background:var(--color-primary)"></span>Acción primaria</div>
</body></html>
