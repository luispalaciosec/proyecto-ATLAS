<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:854px;display:flex;font-family:var(--font-display)}
.main{flex:1;background:var(--atlas-purple);display:flex;align-items:center;justify-content:center}
.mark{display:flex;align-items:center;gap:28px}
.mark img{height:190px;filter:invert(1)}
.mark span{color:var(--atlas-off-white);font-size:130px;font-weight:600;letter-spacing:-0.01em}
.strip{width:110px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head><body>
<div class="main"><div class="mark"><img src="assets/logo.svg" alt=""><span>ATLAS</span></div></div>
<div class="strip">
<div style="background:var(--atlas-cyan)"></div>
<div style="background:var(--atlas-green)"></div>
<div style="background:var(--atlas-purple)"></div>
<div style="background:var(--atlas-navy-950)"></div>
</div>
</body></html>
