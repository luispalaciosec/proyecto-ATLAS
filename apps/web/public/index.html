<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas Web</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Atlas Web</h1>
        <p class="subtitle">Local chat over the Atlas platform</p>
      </header>

      <section class="controls">
        <label for="workspace-select">Workspace</label>
        <div class="workspace-row">
          <select id="workspace-select"></select>
          <input id="workspace-new" type="text" placeholder="New brand slug" />
          <button id="workspace-use" type="button">Use</button>
        </div>
        <p id="workspace-active" class="workspace-active"></p>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="chat-form" class="chat-form">
        <label for="goal-input">Goal</label>
        <div class="chat-row">
          <input id="goal-input" type="text" placeholder="Ask Atlas something..." autocomplete="off" />
          <button type="submit">Send</button>
        </div>
      </form>

      <section class="correct-panel">
        <label for="correction-input">Correct last response</label>
        <textarea
          id="correction-input"
          rows="3"
          placeholder="What should have been different?"
        ></textarea>
        <button id="correct-button" type="button">Submit correction</button>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
